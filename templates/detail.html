{% extends "layout.html" %} {% block content %}

<div class="container mx-auto px-4 py-8 max-w-6xl">
  <div class="bg-white ">
    <div class="md:flex">
      <!-- Image du produit -->
      <div class="md:w-1/2">
        <div class="h-full flex items-center justify-center p-6 ">
          <img
            src="{{ product.img }}"
            alt="{{ product.title }}"
            class="object-cover max-h-96 w-full rounded-lg shadow-md transition-transform"
          />
        </div>
      </div>

      <!-- Informations du produit -->
      <div class="md:w-1/2 p-8">
        <div class="flex justify-between items-start">
          <h1 class="text-3xl font-bold text-gray-800 mb-4">
            {{ product.title }}
          </h1>
          <span
            class="bg-blue-600 text-white text-xl font-bold px-4 py-2 rounded-full"
          >
            ${{ product.prix }}
          </span>
        </div>

        <div class="mb-6">
          <h2 class="text-xl font-semibold text-gray-700 mb-2">Description</h2>
          <p class="text-gray-600 leading-relaxed">{{ product.description }}</p>
        </div>

        <div class="mb-6">
          <h2 class="text-xl font-semibold text-gray-700 mb-2">
            Caractéristiques
          </h2>
          <ul class="list-disc list-inside text-gray-600 space-y-2">
            <li>Identifiant: #{{ product.id }}</li>
            <li>Disponibilité: En stock</li>
            <li>Livraison: 2-4 jours ouvrables</li>
          </ul>
        </div>

        <div class="flex space-x-4">
          <a
            href="/add_to_panier/{{ product.id }}"
            class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition duration-300 transform hover:scale-105 flex items-center"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5 mr-2"
              viewBox="0 0 20 20"
              fill="currentColor"
            >
              <path
                d="M3 1a1 1 0 000 2h1.22l.305 1.222a.997.997 0 00.01.042l1.358 5.43-.893.892C3.74 11.846 4.632 14 6.414 14H15a1 1 0 000-2H6.414l1-1H14a1 1 0 00.894-.553l3-6A1 1 0 0017 3H6.28l-.31-1.243A1 1 0 005 1H3zM16 16.5a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0zM6.5 18a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"
              />
            </svg>
            Ajouter au panier
          </a>
          <a
            href="/"
            class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 px-6 rounded-lg transition duration-300"
          >
            Retour
          </a>
        </div>
      </div>
    </div>

</div>

{% endblock %}
