<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="../static/css/output.css" rel="stylesheet" />
  </head>
  <body>
    {% block nav %}
<div class="w-full fixed top-0 bg-amber-100 z-50 text-center text-sm">"L’art de la couture, porté par la passion, taillé pour l’excellence."</div>
    <nav class="bg-blue-800 shadow-lg fixed top-5 w-full z-50">
      <div
        class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4"
      >
        <a href="/" class="flex items-center space-x-3 rtl:space-x-reverse">
          <span class="self-center text-2xl font-bold text-white">OUZEON SHOP</span>
        </a>
        <button
          data-collapse-toggle="navbar-default"
          type="button"
          class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-white rounded-lg md:hidden hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-white"
          aria-controls="navbar-default"
          aria-expanded="false"
        >
          <span class="sr-only">Open main menu</span>
          <svg
            class="w-5 h-5"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 17 14"
          >
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M1 1h15M1 7h15M1 13h15"
            />
          </svg>
        </button>
        <div class="hidden w-full md:block md:w-auto" id="navbar-default">
          <ul
            class="font-medium flex flex-col p-4 md:p-0 mt-4 md:mt-0 md:flex-row md:space-x-8 rtl:space-x-reverse bg-blue-700 md:bg-transparent rounded-lg"
          >
            <li>
              <a
                href="/"
                class="block py-2 px-3 text-white rounded hover:bg-blue-600 md:hover:bg-transparent md:hover:text-blue-200 transition-colors duration-200"
                >Accueil</a
              >
            </li>
            <li>
              <a
                href="/panier"
                class="block py-2 px-3 text-white rounded hover:bg-blue-600 md:hover:bg-transparent md:hover:text-blue-200 transition-colors duration-200"
                >Panier</a
              >
            </li>
            
            <li>
              <a
                href="/contact"
                class="block py-2 px-3 text-white rounded hover:bg-blue-600 md:hover:bg-transparent md:hover:text-blue-200 transition-colors duration-200"
                >Contact</a
              >
            </li>
            <li>
              <a
                href="{{ url_for('logout')}}"
                class="block py-2 px-4 text-white bg-red-600 hover:bg-red-700 rounded-lg transition-colors duration-200 text-center font-semibold"
                >Logout</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>
    {% endblock %}

    <main class="mt-32 mb-10">{% block content %} {% endblock %}</main>
  </body>
</html>
